name: Deploy Website to Cloudflare

on:
  push:
    branches: [website-upgrade-2026-10]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Static Pages
        run: |
          echo "const nextConfig = { output: 'export', images: { unoptimized: true } };" > next.config.js
          echo "module.exports = nextConfig;" >> next.config.js
          npx next build

      - name: Publish to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest deploy --name websites --assets out --compatibility-date 2026-10-19
