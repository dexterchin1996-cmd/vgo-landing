name: Deploy Website to Cloudflare
on:
  push:
    branches: [website-upgrade-2026-10]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: |
          echo "const nextConfig = { output: 'export', images: { unoptimized: true } };" > next.config.js
          echo "module.exports = nextConfig;" >> next.config.js
          npx next build
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest deploy --name websites --assets out --compatibility-date 2026-10-19
