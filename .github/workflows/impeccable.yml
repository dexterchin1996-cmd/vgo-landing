name: Impeccable Design Scan

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run Impeccable
        run: npx --yes @mp3wizard/impeccable detect src/ --json > impeccable-report.json || true

      - name: Show report head
        run: head -100 impeccable-report.json || echo "no report"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: impeccable-report
          path: impeccable-report.json
          if-no-files-found: ignore
